<html lang="en">
<head>

<title>Balanced homodyne receiver | optodraw 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>

<style>
      body { margin: 0; overflow: hidden; background: #f4f6f8; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #141b2d; }
      #info { position: absolute; top: 12px; left: 12px; color: #586173; font-size: 12px; z-index: 10;
           background: rgba(255,255,255,0.92); padding: 10px 14px; border-radius: 11px; border: 1px solid #e6e9f0;
           box-shadow: 0 4px 12px -2px rgba(16,24,40,0.08), 0 2px 4px -2px rgba(16,24,40,0.05); backdrop-filter: blur(8px); }
      #info h3 { margin: 0; color: #141b2d; font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
      #info { padding: 7px 12px; max-width: calc(100vw - 52px); }

      /* one slim bar at the bottom: icon buttons, each menu opens upward; nothing else covers the view */
      #od-bar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 2px; padding: 4px; background: rgba(255,255,255,0.94); border: 1px solid #e6e9f0; border-radius: 12px; box-shadow: 0 4px 12px -2px rgba(16,24,40,0.10), 0 2px 4px -2px rgba(16,24,40,0.06); backdrop-filter: blur(8px); max-width: calc(100vw - 24px); }
      #od-bar .od-item { position: relative; display: flex; align-items: center; }
      #od-bar .od-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; font: 500 12px Inter, -apple-system, 'Segoe UI', sans-serif; color: #3d4659; background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer; white-space: nowrap; }
      #od-bar .od-btn:hover { background: #f1f4f9; color: #141b2d; }
      #od-bar .od-btn[aria-pressed="true"], #od-bar .od-btn[aria-expanded="true"] { background: #e9eeff; color: #2f5cff; }
      #od-bar .od-btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      #od-bar .od-caret { padding: 0 6px; margin-left: -2px; }
      #od-bar .od-sep { width: 1px; height: 18px; background: #e6e9f0; margin: 0 2px; }
      #od-bar .od-menu { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); min-width: 190px; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: #fff; border: 1px solid #e6e9f0; border-radius: 11px; box-shadow: 0 12px 28px -6px rgba(16,24,40,0.18); }
      #od-bar .od-menu[hidden] { display: none; }
      #od-bar .od-menu-end { left: auto; right: 0; transform: none; }
      #od-bar .od-menu button { display: block; width: 100%; text-align: left; font: 500 12px Inter, -apple-system, 'Segoe UI', sans-serif; padding: 6px 9px; color: #141b2d; background: #fff; border: 0; border-radius: 7px; cursor: pointer; }
      #od-bar .od-menu button:hover:not(:disabled) { background: #f1f4f9; }
      #od-bar .od-menu button:disabled { opacity: 0.45; cursor: not-allowed; }
      #od-bar .od-menu button.active { color: #2f5cff; font-weight: 600; }
      #od-bar .od-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: #141b2d; padding: 4px 9px; }
      #od-bar .od-row input[type=range] { flex: 1; min-width: 90px; accent-color: #2f5cff; }
      #od-bar .od-row input[type=color] { width: 34px; height: 22px; padding: 0; border: 1px solid #e6e9f0; border-radius: 5px; background: none; cursor: pointer; }
      #od-bar .od-row select { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid #e6e9f0; border-radius: 6px; background: #fff; color: #141b2d; }

      #od-bar .od-divider { height: 1px; background: #eef1f5; margin: 3px 2px; }
      @media (max-width: 640px) { #od-bar .od-btn span { display: none; } }

      #render-overlay { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 12px; background: rgba(17,22,28,0.86); color: #f3f6fa; padding: 10px 14px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); font-size: 13px; backdrop-filter: blur(6px); }
      #render-overlay[hidden] { display: none; }
      #render-status { min-width: 190px; font-variant-numeric: tabular-nums; }
      #render-overlay .render-actions { display: flex; gap: 6px; }
      #render-overlay button { font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
      #render-overlay button:hover { background: rgba(255,255,255,0.2); }
      #btn-render-save { background: #2f5cff !important; border-color: #2f5cff !important; }

<body data-show-export-controls="true" data-optodraw-lighting-preset="studio" data-optodraw-render-quality="interactive" data-optodraw-postprocessing="false">
<div id="info">
  <h3>Balanced homodyne receiver</h3>
</div>

<div id="od-bar" role="toolbar" aria-label="3D view" data-optodraw-export-controls="true">
  <div class="od-item">
    <button type="button" class="od-btn" aria-haspopup="true" aria-expanded="false" title="Camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Camera</span></button>
    <div class="od-menu" hidden>
    <button type="button" id="btn-camera-isometric" data-camera-preset="isometric">Isometric</button>
    <button type="button" id="btn-camera-top" data-camera-preset="top">Top</button>
    <button type="button" id="btn-camera-front" data-camera-preset="front">Front</button>
    <button type="button" id="btn-camera-side" data-camera-preset="side">Side</button>
    <button type="button" id="btn-camera-cross-section" data-camera-preset="cross_section">Cross-section</button>
    <button type="button" id="btn-camera-free-space-table" data-camera-preset="free_space_table">Free-space table</button>
    </div>
  </div>
  <div class="od-item">
    <button type="button" class="od-btn" aria-haspopup="true" aria-expanded="false" title="World: the background and the floor"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>World</span></button>
    <div class="od-menu" hidden>
      <button type="button" data-world="light">Light</button>
      <button type="button" data-world="dark">Dark</button>
      <button type="button" data-world="none" title="No background and no floor: a transparent canvas">None</button>
      <label class="od-row">Table<input type="color" id="world-table-color" value="#dde3ea" /></label>
    </div>
  </div>
  <button type="button" class="od-btn" id="btn-labels" aria-pressed="false" title="Labels on or off (they are never in saved images)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.4"/></svg><span>Labels</span></button>
  <div class="od-item" id="anim-section">
    <button type="button" class="od-btn" id="anim-toggle" aria-pressed="false" title="Light on or off. Off removes it; Pause in the menu only freezes it"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg><span>Light</span></button>
    <button type="button" class="od-btn od-caret" aria-haspopup="true" aria-expanded="false" title="Light controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
    <div class="od-menu" hidden>
      <button type="button" id="anim-play">Play</button>
      <label class="od-row" title="Playback speed">Speed<input id="anim-speed" type="range" min="0.25" max="4" step="0.05" value="1" /></label>
      <label class="od-row" title="Scrub through the loop">Time<input id="anim-scrub" type="range" min="0" max="1000" value="0" /></label>
      <label class="od-row" title="How the light looks">Look<select id="light-look">
        <option value="light" selected>Light</option><option value="field" title="The steady field: crests, mode shape and interference">Field</option></select></label>
      <div class="od-divider"></div>
      <button type="button" id="light-tour" title="Play tour: the camera follows the light from device to device">Play tour</button>
      <button type="button" id="light-record" disabled title="Record video: saves the tour as a WebM in real time. The WebM has no part labels. The editor and Python make the MP4.">Record video</button>
    </div>
  </div>
  <div class="od-sep"></div>
  <div class="od-item">
    <button type="button" class="od-btn" aria-haspopup="true" aria-expanded="false" title="Save an image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 19h16"/></svg><span>Save</span></button>
    <div class="od-menu" hidden>
      <button type="button" id="btn-export-png" data-export-hook="png">PNG image</button>
      <button type="button" id="btn-export-png-clear" title="The parts only, on a transparent background">PNG, transparent</button>
    </div>
  </div>
  <button type="button" class="od-btn" id="btn-fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Fullscreen</span></button>
  <div class="od-item">
    <button type="button" class="od-btn" aria-haspopup="true" aria-expanded="false" title="More"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></svg><span>More</span></button>
    <div class="od-menu od-menu-end" hidden>
      <button type="button" id="btn-export-glb" data-export-hook="glb">3D model (GLB)</button>
      <button type="button" id="btn-export-json" data-export-hook="json">Scene (JSON)</button>
      <button type="button" id="btn-pathtrace" title="A photoreal image from optodraw's studio renderer">Photoreal render</button>
      <p class="od-help">Drag to orbit. Scroll to zoom. Right-click to pan.</p>
    </div>
  </div>
</div><!-- /od-bar -->

<div id="render-overlay" hidden>
  <div id="render-status">Starting…</div>
  <div class="render-actions">
    <button type="button" id="btn-render-save">Save PNG</button>
    <button type="button" id="btn-render-exit">Exit render</button>
  </div>
</div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { GTAOShader } from 'three/addons/shaders/GTAOShader.js';
import { PoissonDenoiseShader } from 'three/addons/shaders/PoissonDenoiseShader.js';

// --- Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f4f6f8');
scene.fog = new THREE.FogExp2('#f4f6f8', 0.0);
scene.userData.optodrawRender = { lightingPreset: 'studio', renderQuality: 'interactive', postprocessing: false };

// Wide clip range + logarithmic depth buffer (see renderer) so you can zoom from
// sub-micron features out to a whole mm-scale chip with no hard limits and no z-fighting.
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.02, 5_000_000);
const _initialDir = new THREE.Vector3(0.75, 0.62, 1.0);
if (_initialDir.lengthSq() > 0) { _initialDir.normalize(); } else { _initialDir.set(1, 1, 1).normalize(); }
camera.position.copy(_initialDir.clone().multiplyScalar(80));
camera.lookAt(0, 0, 0);

const renderer = (() => {
  try {
    return new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true, preserveDrawingBuffer: true });
  } catch (error) {
    const cap = null;
    if (!(cap && cap.engine === 'studio')) throw error;
    // no WebGL here: a stand-in, so the page still builds the scene that the studio renderer draws on the CPU
    return { noWebGL: true, domElement: document.createElement('canvas'), shadowMap: {}, toneMapping: 0,
             toneMappingExposure: 1, outputColorSpace: '', setSize() {}, setPixelRatio() {}, setClearColor() {},
             render() {} };
  }
})();
const FLOOR_GRID = false;
const TRANSPARENT_WORLD = false;
const OD_CAPTURE = null;
const OD_VIDEO = false;
const STUDIO_LIGHT = true;   // the viewer lit by the studio renderer's softboxes
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// Khronos PBR Neutral keeps a base colour true (ACES washed #2b6cb0 silicon out to a pale sky blue)
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

if (!renderer.noWebGL) {
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
}

// Label renderer
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0px';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

// Component labels are HTML overlays (never baked into saved WebGL images); toggleable.
let _labelsOn = false;
let _labelsForced = false;     // the tour shows the label of the device in focus, also with labels off
function setLabels(on) {
  _labelsOn = !!on;
  labelRenderer.domElement.style.display = _labelsOn || _labelsForced ? '' : 'none';
  const b = document.getElementById('btn-labels');
  if (b) b.classList.toggle('active', _labelsOn);
}
function odForceLabels(on) {
  _labelsForced = !!on;
  labelRenderer.domElement.style.display = _labelsOn || _labelsForced ? '' : 'none';
}

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.zoomToCursor = true;   // wheel zoom dives toward the pointer — natural deep zoom
controls.zoomSpeed = 1.2;

    // --- Post-processing: ambient occlusion (quality "high") and the optional publication bloom ---
    const composer = renderer.noWebGL ? null : (() => {
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      for (const shader of [GTAOShader, PoissonDenoiseShader]) {
        shader.uniforms.odLogFar = { value: 1.0 };
        let fs = shader.fragmentShader.replace('uniform mat4 cameraProjectionMatrixInverse;',
          'uniform mat4 cameraProjectionMatrixInverse;\nuniform float odLogFar;');
        fs = fs.replace(/vec3 getViewPosition\(\s*const in vec2 screenPosition,\s*const in float depth\s*\)\s*\{[\s\S]*?return viewSpacePosition\.xyz \/ viewSpacePosition\.w;\s*\}/,
          'vec3 getViewPosition( const in vec2 screenPosition, const in float depth ) {\n' +
          '  float viewZ = -(exp2(depth * odLogFar) - 1.0);\n' +
          '  vec4 p = cameraProjectionMatrixInverse * vec4(screenPosition * 2.0 - 1.0, -1.0, 1.0);\n' +
          '  vec3 nearPoint = p.xyz / p.w;\n' +
          '  return nearPoint * (viewZ / nearPoint.z);\n}');
        fs = fs.replace('return perspectiveDepthToViewZ(depth, cameraNear, cameraFar);', 'return -(exp2(depth * odLogFar) - 1.0);');
        shader.fragmentShader = fs;
      }
      const gtao = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
      gtao.gtaoMaterial.uniforms.odLogFar.value = Math.log2(camera.far + 1.0);
      gtao.pdMaterial.uniforms.odLogFar.value = Math.log2(camera.far + 1.0);
      gtao.blendIntensity = 0.85;
      composer.addPass(gtao);
      window.__odGTAO = gtao;
      composer.addPass(new OutputPass());
      return composer;
    })();
    

// --- Lighting ---
const hemiLight = new THREE.HemisphereLight(0xffffff, 0xd8dee6, 1.1);
scene.add(hemiLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.05);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(30, 50, 40);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);
scene.add(dirLight.target);
const _keyDir = dirLight.position.clone().normalize();
// the default shadow box is 10 units round the origin with no bias: no shadow outside it, stripes inside.
// Fit it to the content and keep the key light's direction.
// The studio's overhead softbox in real time: a second shadowing light from straight above (its soft
// shadow grounds the parts); off until the studio light turns it on.
const topLight = new THREE.DirectionalLight(0xffffff, 0);
topLight.castShadow = true;
topLight.shadow.camera.up.set(0, 0, 1);            // it looks straight down: y cannot be its up
topLight.shadow.mapSize.width = 2048;
topLight.shadow.mapSize.height = 2048;
scene.add(topLight);
scene.add(topLight.target);
const _topDir = new THREE.Vector3(0, 1, 0);
function odFitLight(light, dir, sphere) {
  const r = Math.max(sphere.radius, 1.0);
  light.target.position.copy(sphere.center);
  light.position.copy(sphere.center).addScaledVector(dir, r * 3.0);
  const cam = light.shadow.camera;
  cam.left = -r * 1.05; cam.right = r * 1.05; cam.top = r * 1.05; cam.bottom = -r * 1.05;
  cam.near = r * 0.5; cam.far = r * 6.0; cam.updateProjectionMatrix();
  light.shadow.bias = -0.0004;
  light.shadow.normalBias = r * 0.003;
}
// A chip alone stands on a studio floor that fades into the backdrop, as in the studio renderer's image
// (solid to 0.75 of the content's half-diagonal, gone at 1.6). The studio renderer draws its own exact floor.
let _studioFloor = null;
function odStudioFloor(box) {
  if (!STUDIO_LIGHT || !IS_ONCHIP || MIXED || box.isEmpty()) return;
  const R = Math.max(0.5 * Math.hypot(box.max.x - box.min.x, box.max.z - box.min.z), 1e-3);
  if (!_studioFloor) {
    const n = 256, cv = document.createElement('canvas');
    cv.width = n; cv.height = n;
    const g = cv.getContext('2d'), grad = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.75 / 1.6, '#ffffff'); grad.addColorStop(1, '#000000');
    g.fillStyle = grad; g.fillRect(0, 0, n, n);
    const mat = new THREE.MeshStandardMaterial({ color: (WORLDS[_world] || WORLDS.light).bgBottom, roughness: 0.85,
      metalness: 0, transparent: true, alphaMap: new THREE.CanvasTexture(cv), depthWrite: false });
    _studioFloor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    _studioFloor.rotation.x = -Math.PI / 2;
    _studioFloor.receiveShadow = true;
    _studioFloor.userData.odStudioFloor = true;
    scene.add(_studioFloor);
  }
  _studioFloor.scale.set(3.2 * R, 3.2 * R, 1);
  _studioFloor.position.set((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2);
  _studioFloor.visible = _world !== 'none';
}
function odFitShadow(box) {
  odStudioFloor(box);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  odFitLight(dirLight, _keyDir, sphere);
  odFitLight(topLight, _topDir, sphere);
  // ambient occlusion reaches a few percent of the content: contact shadows, not a dark haze
  if (window.__odGTAO) {
    const reach = Math.max(sphere.radius, 1.0) * 0.08;
    window.__odGTAO.updateGtaoMaterial({ radius: reach, thickness: reach, scale: 1.2 });
  }
}

const fillLight = new THREE.DirectionalLight(0xfff6e8, 1.0);
fillLight.position.set(-20, 25, -20);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xdde9ff, 0.65);
rimLight.position.set(10, 18, 32);
scene.add(rimLight);

// --- Optical table material (the table + grid are sized to the content below) ---
const tableMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.95, metalness: 0.02 });

// --- World / environment presets (neutral studio; lights stay fixed in world space) ---
let _gridHelper = null;
let _tableMesh = null;
const WORLDS = {
  light: { bgTop: '#eef1f4', bgBottom: '#bcc5d2', hemiSky: '#ffffff', hemiGround: '#d8dee6', hemiIntensity: 0.6, ambient: '#ffffff', ambientIntensity: 0.3, exposure: 1.0, envIntensity: 0.4, tableColor: '#dde3ea', gridColor: '#b4bdca' },
  night: { bgTop: '#0b1033', bgBottom: '#151a4a', hemiSky: '#aab6d8', hemiGround: '#0a0d26', hemiIntensity: 0.55, ambient: '#9fb0d8', ambientIntensity: 0.32, exposure: 1.28, envIntensity: 0.45, tableColor: '#171c4a', gridColor: '#2a3170', lights: 0.12 },
  dark:  { bgTop: '#232a33', bgBottom: '#13171c', hemiSky: '#aab6c4', hemiGround: '#0d1014', hemiIntensity: 0.62, ambient: '#9fb0c4', ambientIntensity: 0.36, exposure: 1.28, envIntensity: 0.5, tableColor: '#1b2027', gridColor: '#3a434f' },
};
function _gradientTexture(top, bottom) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, top); grad.addColorStop(1, bottom);
  g.fillStyle = grad; g.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}

const odGeometryCache = new Map();

function odResourceKey(value) {

  if (value && typeof value === 'object') {
    return '{' + Object.keys(value).sort().map(k => JSON.stringify(k) + ':' + odResourceKey(value[k])).join(',') + '}';

function odExpandSceneData(data) {

    const record = { ...source };
    if ('materialRef' in record) {
      const material = data.materials[record.materialRef];
      if (!material) throw new Error('Missing material reference: ' + record.materialRef);
      record.material = { ...material }; delete record.materialRef;

function odHighlightMaterial(mesh, enabled) {

    const original = mesh.material;

    const clones = new Map();
    const highlight = material => {

// The light player. It draws the physics engine's light (the payload in window.__odLightData) on the drawn
// guides, beams and fibre cables. Every number comes from the payload: the edges, the packets' entry and exit
// times, their powers, widths and colours, the train period, the source power, each part edge's profile (the share
// of its power at each point where edges share a guide), and the rails of coupling sections (one light per rail, with
// its power at each point, per engine bucket), which replace the transfers they draw. The player only moves each
// packet along its edge (or rail) between its entry and exit time, so it moves at the guide's group velocity.
// The Field look draws the engine's steady state (the payload's cw): E = amp cos(phase - omega t) times a mode shape
// across each guide, from the amplitude and display phase the payload gives along each edge and rail, the multimode
// regions from their sampled fields, and a front that fades in over one crest where the light first arrives. Where
// fields meet the payload has already added them. omega is a display frequency: one cycle per cw.cycle_s seconds.
window.odLight = (function () {
  const S = { enabled: false, playing: false, speed: 1.0, t: 0, raw: 0, look: 'light', group: null, built: false };
  const STEP = 0.5;               // sample spacing along an edge, in scene units
  const MAX_SAMPLES = 1500;       // samples per edge at most (longer edges get a wider spacing)
  const HALO = 3.0;               // the glow is this many guide widths wide
  const VIEWPORT = { value: 1 };  // the drawing height in pixels, shared by every glow
  // The brightest glow, the sources' whole power at the middle of a guide, is PEAK in linear light after the renderer's
  // exposure (white is 1). The Neutral tone mapping is straight up to 0.76 and then bends softly toward white, so the
  // drawn brightness keeps its ratio, at every zoom, up to about 0.8 of the sources' root power, and brighter light
  // still rises, more slowly, and stays below white.
  const PEAK = 0.9;
  const GAIN = { value: PEAK };   // PEAK over the exposure, shared by every glow
  const FIELD_HALF = 0.8;         // the field ribbon is this many guide widths each way: the mode's tails
  const FIELD_TIME = { value: 0 }, FIELD_OMEGA = { value: 0 }, REF = { value: 1 };   // ps; omega t; the sources' amplitude
  const DOWN = new THREE.Vector3(0, -1, 0), UP = new THREE.Vector3(0, 1, 0);
  const SMOOTH = 2.0;             // the ribbon's direction is the path's over this length each way (scene units)
  const OPEN = 1e6;               // nothing above a sample, or no bend
  const HEAT_TIME = { value: 0 };   // the time as asked, in seconds: the heat grows on it
  const HEAT_CELLS = 40000;       // the most vertices of one heater's map
  const HEAT_ALPHA = 0.35, RF_ALPHA = 0.25;     // the most a map covers what is under it: the optical field stays clear
  const HEAT_STOPS = [[0, [0.15, 0.01, 0.25]], [0.35, [0.55, 0.04, 0.12]], [0.7, [0.85, 0.2, 0.04]], [1, [0.95, 0.38, 0.03]]];
  const RF_POSITIVE = [0.10, 0.95, 0.50], RF_NEGATIVE = [1.0, 0.12, 0.75];   // linear light; both below white
  const raycaster = new THREE.Raycaster();
  let data = null, placed = [], effects = [], psPerSecond = 1, spanS = 0, periodS = 0;
  let itemsBySid = new Map(), recById = new Map(), referencePower = 1;
  let swingEffects = [];          // the heat and RF maps of the tour's driven parts, drawn only while their drive swings
  let last = performance.now() / 1000, scrubbing = false, drawnAt = null;

  // --- the Light look: a short streak with an additive core and a soft halo ----------------------------------
  // A ribbon along the placed path faces the camera. Each vertex moves toward the eye as far as the eye ray from the
  // path runs inside the guide, plus a margin: that changes its depth and not its place on the screen, so the light
  // at mid-height shows through its own guide, and a part above or beside the guide still hides it.
  const VERT = '#include <common>\n#include <logdepthbuf_pars_vertex>\n' + `
    attribute vec3 aTangent;
    attribute float aSide;
    #ifdef FIELD
    attribute vec3 aField;                       // the field look: amplitude, phase, arrival time (ps)
    varying vec3 vField;
    #else
    attribute vec3 aGlow;
    varying vec3 vGlow;
    #endif
    attribute float aGap;                        // from the guide top up to the first part over or beside it
    attribute float aBend;                       // the widest the ribbon may be here without folding on a bend
    uniform float uHalf;
    uniform vec2 uGuide;                         // the guide's half width and half thickness
    uniform float uViewport;                     // the drawing height in pixels
    uniform float uMinPx;                        // the least half width on screen, in pixels
    varying float vSide;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vec3 t = normalize(aTangent), eye = normalize(cameraPosition - wp.xyz);
      // the ribbon's width lies in the view plane (across the camera's axis, not across this vertex's own eye ray),
      // so every point of it has its centre's depth: away from the middle of a wide view an eye ray tilts, and a
      // ribbon across it would bring one edge nearer than its centre, over metal beside the guide
      vec3 forward = -vec3(viewMatrix[0][2], viewMatrix[1][2], viewMatrix[2][2]);
      vec3 across = cross(t, forward);
      float n = length(across);
      across = n > 1e-5 ? across / n : vec3(0.0, 1.0, 0.0);
      vec3 side = cross(vec3(0.0, 1.0, 0.0), t);
      side = length(side) > 1e-4 ? normalize(side) : vec3(1.0, 0.0, 0.0);
      float inside = min(uGuide.y / max(abs(eye.y), 1e-3), uGuide.x / max(abs(dot(eye, side)), 1e-3));
      float depth = max(-(viewMatrix * wp).z, 1e-6);
      // the margin: 0.3 % of the view distance (smaller did not clear the guide in a test), but never more than half
      // the gap to a part over or beside the guide, so that part still hides the light
      float margin = min(0.003 * depth, 0.5 * aGap);
      float lift = 1.05 * min(inside, 50.0 * max(uGuide.x, uGuide.y)) + margin;
      // display only: the light's ribbon is at least 10 px half wide on screen (the field's 4 px). With the profile in
      // FRAG, the halo is then at least 12 px wide at half height and the core at least 6.7 px. On a tight bend it
      // stays narrower than the bend.
      float pixel = 2.0 * depth / (projectionMatrix[1][1] * uViewport);
      vec3 p = wp.xyz + across * aSide * min(max(uHalf, uMinPx * pixel), aBend);
      // an edge that reaches below the guide's foot would hide behind the floor in front of it: it clears that floor
      vec3 toEye = normalize(cameraPosition - p);
      float foot = wp.y - uGuide.y;
      if (p.y < foot && toEye.y > 1e-3) lift = max(lift, 1.02 * (foot - p.y) / toEye.y + margin);
      wp.xyz = p + toEye * lift;
      #ifdef FIELD
      vField = aField;
      #else
      vGlow = aGlow;
      #endif
      vSide = aSide;
      gl_Position = projectionMatrix * viewMatrix * wp;
      #include <logdepthbuf_vertex>
    }`;
  const FRAG = '#include <common>\n#include <logdepthbuf_pars_fragment>\n' + `
    uniform float uGain;                       // PEAK over the exposure
    varying vec3 vGlow;
    varying float vSide;
    void main() {
      #include <logdepthbuf_fragment>
      float d = vSide * vSide;
      // the core: flat across the guide and falling at its sides (half height at about a third of the half width,
      // the guide's width), so a streak reads as a lit guide; the halo: a soft glow round it
      float core = exp(-d * d / 0.0256);
      float halo = 0.5 * exp(-d / 0.52);
      // the brightness is the root of the power over the sources' power: 1 for all of it. A soft knee keeps more
      // (packets of one train that overlap, a ring's build-up) below 1: straight up to 0.85, then bending toward 1.
      float m = max(max(vGlow.r, vGlow.g), vGlow.b);
      float k = m <= 0.85 ? m : 0.85 + 0.15 * (1.0 - 2.0 / (exp(2.0 * (m - 0.85) / 0.15) + 1.0));
      vec3 glow = m > 0.0 ? vGlow * (k / m) : vec3(0.0);
      // at most 1: the blend (see glowMesh) then has no negative factor
      gl_FragColor = vec4(min(uGain * glow * (core + halo) / 1.5, vec3(1.0)), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;

  // --- the Field look: the field's colour and its amplitude as opacity -------------------------------------------
  // e is the field over its amplitude. One wavelength that is not visible (white): blue at -1, white at 0, red at +1.
  // Any other wavelength, its own colour (a visible one its true colour): full at a crest, dim at a trough. The
  // opacity follows |e| as well, so crests and troughs read and the zeros between them do not (linear light).
  const FIELD_COLOUR = `
    uniform vec3 uTint;
    uniform float uPlain;
    vec3 fieldColour(float e) {
      if (uPlain > 0.5) return e >= 0.0 ? mix(vec3(1.0), vec3(0.791, 0.032, 0.021), e) : mix(vec3(1.0), vec3(0.021, 0.155, 0.791), -e);
      return uTint * (0.6 + 0.4 * e);
    }
    float fieldWeight(float e) { return 0.35 + 0.65 * abs(e); }`;
  const FIELD_FRAG = '#include <common>\n#include <logdepthbuf_pars_fragment>\n' + FIELD_COLOUR + `
    uniform float uGain, uTime, uOmegaT, uFade, uRef;
    varying vec3 vField;
    varying float vSide;
    void main() {
      #include <logdepthbuf_fragment>
      // the front: dark before the light arrives, full one crest behind it
      float front = clamp((uTime - vField.z) / uFade, 0.0, 1.0);
      // the mode across the guide: a Gaussian, 1/e at the guide's edge (0.625 of the ribbon's half width)
      float mode = exp(-vSide * vSide / 0.39);
      float e = cos(vField.y - uOmegaT);
      gl_FragColor = vec4(uGain * fieldColour(e), clamp(vField.x / uRef, 0.0, 1.0) * front * mode * fieldWeight(e));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;
  // --- heat and RF (the Field look only): closed forms of the payload's constants, drawn under the optical field -------
  // A flat mesh on the cladding, moved toward the eye by 0.3 % of the view distance. vA is set per mesh: the heat's
  // distance to the heater spine (um); the RF's distance along the electrodes (um). Nothing is drawn outside the chip.
  const EFFECT_VERT = '#include <common>\n#include <logdepthbuf_pars_vertex>\n' + `
    attribute float aA;
    varying float vA;
    varying vec2 vXZ;
    void main() {

    const w1 = hit.u, w2 = hit.v, w0 = 1 - w1 - w2;
    let nx = gx, ny = gy, nz = gz;
    if (D.normals) {
      const N = D.normals;
      let ax = w0 * N[i] + w1 * N[i + 3] + w2 * N[i + 6], ay = w0 * N[i + 1] + w1 * N[i + 4] + w2 * N[i + 7];
      let az = w0 * N[i + 2] + w1 * N[i + 5] + w2 * N[i + 8];
      const al = Math.hypot(ax, ay, az);
      if (al > 1e-12) {
        ax /= al; ay /= al; az /= al;
        if (ax * gx + ay * gy + az * gz < 0) { ax = -ax; ay = -ay; az = -az; }
        nx = ax; ny = ay; nz = az;
      }
    }
    s.px = ox + dx * hit.t; s.py = oy + dy * hit.t; s.pz = oz + dz * hit.t;
    s.nx = nx; s.ny = ny; s.nz = nz; s.gx = gx; s.gy = gy; s.gz = gz;
    const mi = D.material[tri], m = D.materials[mi];
    s.mi = mi; s.base[0] = m.base[0]; s.base[1] = m.base[1]; s.base[2] = m.base[2]; s.alpha = m.opacity;
    if (m.texture >= 0 && D.uvs) {
      const T = D.textures[m.texture], U = D.uvs, j = tri * 6;
      let u = w0 * U[j] + w1 * U[j + 2] + w2 * U[j + 4], v = w0 * U[j + 1] + w1 * U[j + 3] + w2 * U[j + 5];
      if (m.uvMatrix) {
        const e = m.uvMatrix, uu = e[0] * u + e[3] * v + e[6];
        v = e[1] * u + e[4] * v + e[7]; u = uu;
      }
      u = T.wrapS === 'repeat' ? u - Math.floor(u) : Math.min(1, Math.max(0, u));
      v = T.wrapT === 'repeat' ? v - Math.floor(v) : Math.min(1, Math.max(0, v));
      const x = Math.min(T.width - 1, Math.floor(u * T.width));
      const y = Math.min(T.height - 1, Math.floor((T.flipY ? 1 - v : v) * T.height));
      const k = (y * T.width + x) * 4;
      s.base[0] *= SRGB_TO_LINEAR[T.data[k]]; s.base[1] *= SRGB_TO_LINEAR[T.data[k + 1]];
      s.base[2] *= SRGB_TO_LINEAR[T.data[k + 2]]; s.alpha *= T.data[k + 3] / 255;
    }
  }

  // Light that leaves a secondary hit toward the ray: open studio light, no further rays.
  function bounce(ctx, ox, oy, oz, dx, dy, dz, out) {
    const s = ctx.s2;
    surface(ctx, ox, oy, oz, dx, dy, dz, ctx.hit2, s);
    const m = ctx.data.materials[s.mi];
    if (m.unlit) { out[0] = s.base[0]; out[1] = s.base[1]; out[2] = s.base[2]; clampBounce(out); return; }
    const nv = Math.max(1e-3, -(s.nx * dx + s.ny * dy + s.nz * dz));
    const rough = Math.max(0.04, Math.min(1, m.rough)), w = ctx.w2, dl = ctx.dl, sl = ctx.sl;
    weights(ctx.tables, s.base, m.metal, rough, nv, w);
    diffuseLight(ctx.tables, ctx.env, s.nx, s.ny, s.nz, dl);
    specularLight(ctx.env, dx + 2 * nv * s.nx, dy + 2 * nv * s.ny, dz + 2 * nv * s.nz, rough, sl);
    for (let c = 0; c < 3; c++) out[c] = w[3 + c] * dl[c] + w[c] * sl[c] + m.emissive[c];
    clampBounce(out);
  }

  // A few glossy rays that meet a thin, very bright part (a beam) flash single pixels white: what a secondary
  // hit returns is held to BOUNCE_MAX in its brightest channel, hue kept.
  const BOUNCE_MAX = 2.0;
  function clampBounce(out) {
    const peak = Math.max(out[0], out[1], out[2]);
    if (peak > BOUNCE_MAX) { const k = BOUNCE_MAX / peak; out[0] *= k; out[1] *= k; out[2] *= k; }
  }

  // The visible share of each softbox from (ox, oy, oz) with normal n, into ctx.vis (soft shadows).
  function visibility(ctx, ox, oy, oz, nx, ny, nz, cp, sp) {
    const { bvh, opaque, env, vis } = ctx;
    for (let j = 0; j < env.lobes.length; j++) {
      const L = ctx.shadowDirs[j], f = L.f, d = L.d, S = L.s, half = 3 * Math.ceil(S.length / 6);
      let seen = 0, total = 0, lit = 0, dark = 0;
      for (let k = 0; k < S.length; k += 3) {
        // the first half all lit or all dark: the light is open or shut here, the rest cannot change it
        if (k === half && (lit === 0 || dark === 0) && lit + dark >= 2) break;
        const a = S[k] * cp - S[k + 1] * sp, b = S[k] * sp + S[k + 1] * cp, c = S[k + 2];
        const lx = f[0] * a + f[3] * b + d[0] * c, ly = f[1] * a + f[4] * b + d[1] * c, lz = f[2] * a + f[5] * b + d[2] * c;
        const weight = nx * lx + ny * ly + nz * lz;
        if (weight <= 0) continue;
        total += weight;
        if (occluded(bvh, ox, oy, oz, lx, ly, lz, Infinity, opaque)) { dark++; continue; }
        seen += ctx.glass && occluded(bvh, ox, oy, oz, lx, ly, lz, Infinity, ctx.glass) ? weight * GLASS_SHADOW : weight;
        lit++;
      }
      vis[j] = total > 0 ? seen / total : 0;
    }
  }

  // How much of the open light a floor point loses to the parts: 0 open, 1 fully shadowed.
  function floorShadow(ctx, s, key) {
    const { env, tables, vis, rays } = ctx, ox = s.px, oy = s.py + ctx.bias, oz = s.pz;
    const phase = hash(key) * 2 * Math.PI, cp = Math.cos(phase), sp = Math.sin(phase);
    visibility(ctx, ox, oy, oz, 0, 1, 0, cp, sp);
    let open = env.ambient[1], lit = 0;
    for (let j = 0; j < env.lobes.length; j++) {
      const w = sampleTable(tables.diffuse[j], 0, 1, 0) * env.lobes[j].color[1];
      open += w; lit += w * vis[j];
    }
    let blocked = 0;
    for (let i = 0; i < rays.fill; i++) {                 // contact shadow: the ambient the parts close off
      const phi = (2 * Math.PI * i) / rays.fill + phase;
      if (occluded(ctx.bvh, ox, oy, oz, 0.7 * Math.cos(phi), 0.714, 0.7 * Math.sin(phi), ctx.contact, ctx.opaque)) blocked++;
    }
    lit += env.ambient[1] * (rays.fill ? 1 - blocked / rays.fill : 1);
    return Math.max(0, Math.min(1, 1 - lit / open));
  }

  // Light that leaves surface ``s`` toward a ray of direction d: shadowed softboxes, fill, reflections.
  function shade(ctx, s, dx, dy, dz, key, out) {
    const m = ctx.data.materials[s.mi];
    if (m.unlit) { out[0] = s.base[0]; out[1] = s.base[1]; out[2] = s.base[2]; return; }
    const { bvh, opaque, env, tables, rays, vis } = ctx, nx = s.nx, ny = s.ny, nz = s.nz;
    const nv = Math.max(1e-3, -(nx * dx + ny * dy + nz * dz));
    const rx = dx + 2 * nv * nx, ry = dy + 2 * nv * ny, rz = dz + 2 * nv * nz;
    const rough = Math.max(0.04, Math.min(1, m.rough)), metal = m.metal, w = ctx.w;
    weights(tables, s.base, metal, rough, nv, w);
    const ox = s.px + s.gx * ctx.bias, oy = s.py + s.gy * ctx.bias, oz = s.pz + s.gz * ctx.bias;
    const phase = hash(key) * 2 * Math.PI, cp = Math.cos(phase), sp = Math.sin(phase);
    visibility(ctx, ox, oy, oz, nx, ny, nz, cp, sp);
    const dl = ctx.dl, sl = ctx.sl;
    diffuseLight(tables, env, nx, ny, nz, dl, vis);
    let r = w[3] * dl[0], g = w[4] * dl[1], b = w[5] * dl[2];
    specularLight(env, rx, ry, rz, rough, sl, vis);
    let sr = w[0] * sl[0], sg = w[1] * sl[1], sb = w[2] * sl[2];
    const f = frame(nx, ny, nz), c2 = ctx.c2, amb = env.ambient;
    if (metal < 1 && rays.fill > 0) {                   // fill: blocked ambient becomes light from the hit
      let blocked = 0, fr = 0, fg = 0, fb = 0;
      for (let i = 0; i < rays.fill; i++) {
        const phi = (2 * Math.PI * i) / rays.fill + phase, a = 0.7 * Math.cos(phi), bb = 0.7 * Math.sin(phi), c = 0.714;
        const lx = f[0] * a + f[3] * bb + nx * c, ly = f[1] * a + f[4] * bb + ny * c, lz = f[2] * a + f[5] * bb + nz * c;
        if (closestHit(bvh, ox, oy, oz, lx, ly, lz, Infinity, ctx.hit2, opaque)) {
          blocked++;
          bounce(ctx, ox, oy, oz, lx, ly, lz, c2);
          fr += c2[0] - amb[0]; fg += c2[1] - amb[1]; fb += c2[2] - amb[2];
        }
      }
      if (blocked) { r += (w[3] * fr) / rays.fill; g += (w[4] * fg) / rays.fill; b += (w[5] * fb) / rays.fill; }
    }
    // reflections where they show: all rays on metal, half on smooth dielectrics, none on rough ones (their
    // 4% specular takes the open studio light)
    const nr = metal > 0.5 ? rays.reflect : rough < 0.35 ? Math.ceil(rays.reflect / 2) : 0;
    if (nr > 0) {                                        // GGX rays with one secondary hit
      const rf = frame(rx, ry, rz), a2 = rough * rough * rough * rough;
      let hitW = 0, totW = 0, br = 0, bg = 0, bb = 0;
      for (let i = 0; i < nr; i++) {
        const u = (i + 0.5) / nr, phi = 2 * Math.PI * radicalInverse(i) + phase;
        const ch = Math.sqrt((1 - u) / (1 + (a2 - 1) * u)), sh = Math.sqrt(1 - ch * ch);
        const hx = rf[0] * sh * Math.cos(phi) + rf[3] * sh * Math.sin(phi) + rx * ch;
        const hy = rf[1] * sh * Math.cos(phi) + rf[4] * sh * Math.sin(phi) + ry * ch;
        const hz = rf[2] * sh * Math.cos(phi) + rf[5] * sh * Math.sin(phi) + rz * ch;
        const lx = 2 * ch * hx - rx, ly = 2 * ch * hy - ry, lz = 2 * ch * hz - rz;
        const weight = Math.max(0, rx * lx + ry * ly + rz * lz);
        totW += weight;
        if (weight === 0 || nx * lx + ny * ly + nz * lz <= 0) continue;
        if (closestHit(bvh, ox, oy, oz, lx, ly, lz, Infinity, ctx.hit2, opaque)) {
          hitW += weight;
          bounce(ctx, ox, oy, oz, lx, ly, lz, c2);
          br += c2[0] * weight; bg += c2[1] * weight; bb += c2[2] * weight;
        }
      }
      if (totW > 0 && hitW > 0) {
        const open = 1 - hitW / totW;
        sr = sr * open + (w[0] * br) / totW; sg = sg * open + (w[1] * bg) / totW; sb = sb * open + (w[2] * bb) / totW;
      }
    }
    out[0] = r + sr + m.emissive[0]; out[1] = g + sg + m.emissive[1]; out[2] = b + sb + m.emissive[2];
  }

  // Light along the mirror direction of a smooth surface: one ray, its hit's open light, else the studio.
  function mirror(ctx, s, dx, dy, dz, rough, out) {
    const nv = Math.max(1e-3, -(s.nx * dx + s.ny * dy + s.nz * dz));
    const rx = dx + 2 * nv * s.nx, ry = dy + 2 * nv * s.ny, rz = dz + 2 * nv * s.nz;
    const ox = s.px + s.gx * ctx.bias, oy = s.py + s.gy * ctx.bias, oz = s.pz + s.gz * ctx.bias;
    if (closestHit(ctx.bvh, ox, oy, oz, rx, ry, rz, Infinity, ctx.hit2, ctx.opaque)) bounce(ctx, ox, oy, oz, rx, ry, rz, out);
    else { specularLight(ctx.env, rx, ry, rz, rough, out); clampBounce(out); }
  }

  // A camera ray through up to 8 surfaces: premultiplied linear RGB and coverage into out[0..3]. Glass
  // splits the ray (Fresnel): the reflected part is added, the refracted ray goes on, tinted.
  function trace(ctx, ox, oy, oz, dx, dy, dz, key, out) {
    const s = ctx.s1, c = ctx.c, hit = ctx.hit, first = ctx.first;
    let r = 0, g = 0, b = 0, tr = 1, tg = 1, tb = 1, er = 0, eg = 0, eb = 0;
    first.id = 0;
    const F = ctx.floor;
    for (let depth = 0; depth < 8 && tr + tg + tb > 0.012; depth++) {
      const found = closestHit(ctx.bvh, ox, oy, oz, dx, dy, dz, Infinity, hit);
      if (F && dy < 0) {                                   // the floor, when it comes before any part
        const tf = (F.y - oy) / dy;
        if (tf > T_MIN && (!found || tf < hit.t)) {
          s.px = ox + dx * tf; s.py = F.y; s.pz = oz + dz * tf;
          const dist = Math.hypot(s.px - F.cx, s.pz - F.cz);
          const fade = dist <= F.r0 ? 1 : dist >= F.r1 ? 0 : 0.5 + 0.5 * Math.cos(Math.PI * (dist - F.r0) / (F.r1 - F.r0));
          if (depth === 0) { first.id = F.mi + 1; first.t = tf; first.nx = 0; first.ny = 1; first.nz = 0; first.r = first.g = first.b = 0.6; }
          if (fade > 0) {
            s.nx = 0; s.ny = 1; s.nz = 0; s.gx = 0; s.gy = 1; s.gz = 0; s.mi = F.mi; s.alpha = 1; s.front = true;
            const fm = ctx.data.materials[F.mi];
            s.base[0] = fm.base[0]; s.base[1] = fm.base[1]; s.base[2] = fm.base[2];
            if (F.mode === 'studio') {
              shade(ctx, s, dx, dy, dz, key + depth * 0x9e3779b9, c);
              r += tr * fade * c[0]; g += tg * fade * c[1]; b += tb * fade * c[2];
              tr *= 1 - fade; tg *= 1 - fade; tb *= 1 - fade;
            } else {
              const a = fade * floorShadow(ctx, s, key + depth * 0x9e3779b9);
              tr *= 1 - a; tg *= 1 - a; tb *= 1 - a;
            }
          }
          break;                                         // nothing lies under the floor
        }
      }
      if (!found) break;
      surface(ctx, ox, oy, oz, dx, dy, dz, hit, s);
      const m = ctx.data.materials[s.mi];
      if (depth === 0) {                                  // the denoiser's guide: what this pixel looks at
        first.id = s.mi + 1; first.t = hit.t; first.nx = s.nx; first.ny = s.ny; first.nz = s.nz;
        first.r = s.base[0]; first.g = s.base[1]; first.b = s.base[2];
      }
      if (m.transmission > 0) {
        const t = Math.min(1, m.transmission), cosi = Math.max(0, -(dx * s.nx + dy * s.ny + dz * s.nz));
        const f0 = ((m.ior - 1) / (m.ior + 1)) ** 2, F = f0 + (1 - f0) * Math.pow(1 - cosi, 5);
        if (t < 1) {                                      // the part of the surface that is not clear
          shade(ctx, s, dx, dy, dz, key + depth * 0x9e3779b9, c);
          r += tr * (1 - t) * c[0]; g += tg * (1 - t) * c[1]; b += tb * (1 - t) * c[2];
        }
        mirror(ctx, s, dx, dy, dz, Math.max(0.04, m.rough), c);
        r += tr * t * F * c[0]; g += tg * t * F * c[1]; b += tb * t * F * c[2];
        const eta = s.front ? 1 / m.ior : m.ior;
        const d2 = refract([dx, dy, dz], [s.gx, s.gy, s.gz], eta);
        if (!d2) {                                         // total internal reflection: the ray stays inside
          const k = 2 * (dx * s.gx + dy * s.gy + dz * s.gz);
          dx -= k * s.gx; dy -= k * s.gy; dz -= k * s.gz;
          ox = s.px + s.gx * ctx.bias; oy = s.py + s.gy * ctx.bias; oz = s.pz + s.gz * ctx.bias;
          continue;
        }
        const w = t * (1 - F);
        tr *= w * Math.sqrt(s.base[0]); tg *= w * Math.sqrt(s.base[1]); tb *= w * Math.sqrt(s.base[2]);
        dx = d2[0]; dy = d2[1]; dz = d2[2];
        ox = s.px - s.gx * ctx.bias; oy = s.py - s.gy * ctx.bias; oz = s.pz - s.gz * ctx.bias;
        continue;
      }
      const cover = s.alpha;
      if (cover > 0.002) {
        shade(ctx, s, dx, dy, dz, key + depth * 0x9e3779b9, c);
        r += tr * cover * c[0]; g += tg * cover * c[1]; b += tb * cover * c[2];
        const e = m.emissive;
        if (e[0] + e[1] + e[2] > 0) { er += tr * cover * e[0]; eg += tg * cover * e[1]; eb += tb * cover * e[2]; }
      }
      tr *= 1 - cover; tg *= 1 - cover; tb *= 1 - cover;
      ox = s.px + dx * ctx.bias; oy = s.py + dy * ctx.bias; oz = s.pz + dz * ctx.bias;
    }
    out[0] = r; out[1] = g; out[2] = b; out[3] = 1 - (tr + tg + tb) / 3; out[4] = er; out[5] = eg; out[6] = eb;
  }

  // Per-pixel guide for the denoiser and the glow source, tile- or image-sized: material id (0 = nothing),
  // depth, normal (x127), albedo (x255) of the first sample's first surface; emitted light seen (premultiplied).
  function newGBuffer(w, h) {
    return { id: new Uint16Array(w * h), depth: new Float32Array(w * h), normal: new Int8Array(w * h * 3),
             albedo: new Uint8Array(w * h * 3), emit: new Float32Array(w * h * 3) };
  }

  // Pixels [x0, x0 + tw) x [y0, y0 + th) of the image into buf (premultiplied linear RGBA, tile order), and
  // into the guide buffer ``gb`` when given. A pixel's samples depend only on its place in the whole image,
  // so any tiling gives the same numbers.
  function renderTile(ctx, x0, y0, tw, th, buf, gb) {
    const D = ctx.data, W = D.width, H = D.height, cam = D.camera, S = Math.max(1, D.samples | 0);
    const g = Math.max(1, Math.round(Math.sqrt(S))), n = g * g, px = new Float64Array(7), first = ctx.first;
    const tx = cam.tanHalfY * cam.aspect, ty = cam.tanHalfY;
    for (let y = y0; y < y0 + th; y++) for (let x = x0; x < x0 + tw; x++) {
      let r = 0, gg = 0, b = 0, a = 0, er = 0, eg = 0, eb = 0;
      const o = (y - y0) * tw + (x - x0);
      for (let k = 0; k < n; k++) {
        const sx = ((k % g) + 0.5) / g, sy = (Math.floor(k / g) + 0.5) / g;
        const nx = ((x + sx) / W) * 2 - 1, ny = 1 - ((y + sy) / H) * 2;
        let dx = -cam.back[0] + nx * tx * cam.right[0] + ny * ty * cam.up[0];
        let dy = -cam.back[1] + nx * tx * cam.right[1] + ny * ty * cam.up[1];
        let dz = -cam.back[2] + nx * tx * cam.right[2] + ny * ty * cam.up[2];
        const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;
        trace(ctx, cam.position[0], cam.position[1], cam.position[2], dx, dy, dz, ((y * W + x) * n + k) * 8, px);
        r += px[0]; gg += px[1]; b += px[2]; a += px[3]; er += px[4]; eg += px[5]; eb += px[6];
        if (k === 0 && gb) {
          gb.id[o] = first.id; gb.depth[o] = first.id ? first.t : 0;
          gb.normal[o * 3] = Math.round(first.nx * 127); gb.normal[o * 3 + 1] = Math.round(first.ny * 127);
          gb.normal[o * 3 + 2] = Math.round(first.nz * 127);
          gb.albedo[o * 3] = Math.round(Math.min(1, first.r) * 255); gb.albedo[o * 3 + 1] = Math.round(Math.min(1, first.g) * 255);
          gb.albedo[o * 3 + 2] = Math.round(Math.min(1, first.b) * 255);
        }
      }
      buf[o * 4] = r / n; buf[o * 4 + 1] = gg / n; buf[o * 4 + 2] = b / n; buf[o * 4 + 3] = a / n;
      if (gb) { gb.emit[o * 3] = er / n; gb.emit[o * 3 + 1] = eg / n; gb.emit[o * 3 + 2] = eb / n; }
    }
  }

  // A 5 x 5 binomial filter over premultiplied RGB that mixes only solid pixels showing the same material
  // at a depth within 2%, a normal within ~11 degrees and an albedo within 0.03 (texture detail stays).
  function denoise(buf, W, H, G) {
    const K = [1, 4, 6, 4, 1], src = Float32Array.from(buf), floorId = G.floor || 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, id = G.id[i];
      if (id && id === floorId) { floorPixel(src, buf, W, H, G, x, y, K); continue; }
      if (!id || src[i * 4 + 3] < 0.999) continue;
      const d = G.depth[i], n0 = G.normal[i * 3], n1 = G.normal[i * 3 + 1], n2 = G.normal[i * 3 + 2];
      const a0 = G.albedo[i * 3], a1 = G.albedo[i * 3 + 1], a2 = G.albedo[i * 3 + 2];
      let r = 0, g = 0, b = 0, total = 0;
      for (let dy = -2; dy <= 2; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= H) continue;
        for (let dx = -2; dx <= 2; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= W) continue;
          const j = yy * W + xx;
          if (G.id[j] !== id || src[j * 4 + 3] < 0.999 || Math.abs(G.depth[j] - d) > d * 0.02) continue;
          if (n0 * G.normal[j * 3] + n1 * G.normal[j * 3 + 1] + n2 * G.normal[j * 3 + 2] < 0.98 * 127 * 127) continue;
          if (Math.abs(a0 - G.albedo[j * 3]) + Math.abs(a1 - G.albedo[j * 3 + 1]) + Math.abs(a2 - G.albedo[j * 3 + 2]) > 0.03 * 255) continue;
          const w = K[dy + 2] * K[dx + 2];
          total += w; r += src[j * 4] * w; g += src[j * 4 + 1] * w; b += src[j * 4 + 2] * w;
        }
      }
      buf[i * 4] = r / total; buf[i * 4 + 1] = g / total; buf[i * 4 + 2] = b / total;
    }
  }

  // A floor (or shadow catcher) pixel: all four channels from floor neighbours at a depth within 2%.
  function floorPixel(src, buf, W, H, G, x, y, K) {
    const i = y * W + x, id = G.id[i], d = G.depth[i];
    let r = 0, g = 0, b = 0, a = 0, total = 0;
    for (let dy = -2; dy <= 2; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= H) continue;
      for (let dx = -2; dx <= 2; dx++) {
        const xx = x + dx;

const geometryExportable = true;
const cameraPresetDirections = {
  "top":[
    0.0,
    1.0,
    0.0001
  ],
  "isometric":[
    0.75,
    0.62,
    1.0
  ],
  "side":[
    1.0,
    0.25,
    0.0
  ],
  "front":[

    0.18,

  ],
  "cross_section":[

    -0.85

};
let viewTarget = new THREE.Vector3(0, 0, 0);
let viewDistance = requestedCameraDistance;

function refreshViewMetrics() {
  if (hasContentBounds) {
    viewTarget.copy(contentBounds.getBoundingSphere(new THREE.Sphere()).center);
    viewDistance = odFitDistance(contentBounds, 1.0);
  }
}
refreshViewMetrics();

function applyCameraPreset(preset) {
  const direction = cameraPresetDirections[preset];
  if (!direction) {
    console.warn('Unknown camera preset', preset);
    return;
  }
  const d = viewDistance;
  const t = viewTarget;
  const offset = new THREE.Vector3(direction[0], direction[1], direction[2]);
  if (offset.lengthSq() === 0) {
    return;
  }
  offset.normalize().multiplyScalar(d);
  camera.position.set(t.x + offset.x, t.y + offset.y, t.z + offset.z);
  camera.lookAt(t);
  controls.target.copy(t);
  controls.update();
}

function downloadFile(filename, blob) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

// Render the scene at high resolution (supersampled) before saving, so exported PNGs
// are crisp print-quality rather than a screen-resolution grab.
function renderToPng() {
  const w = window.innerWidth, h = window.innerHeight;
  const prevPixelRatio = renderer.getPixelRatio();
  const scale = Math.max(1, Math.min(3, 4096 / Math.max(w, h)));   // cap longest edge ~4k
  const tw = Math.round(w * scale), th = Math.round(h * scale);
  const hasComposer = (typeof composer !== 'undefined' && composer);
  renderer.setPixelRatio(1);
  renderer.setSize(tw, th, false);
  if (hasComposer) composer.setSize(tw, th);
  camera.aspect = tw / th; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const dataUrl = renderer.domElement.toDataURL('image/png');
  // restore the interactive viewport
  renderer.setPixelRatio(prevPixelRatio);
  renderer.setSize(w, h, false);
  if (hasComposer) composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  return dataUrl;
}

function downloadPngScreenshot() {
  const baseName = (document.title || 'optodraw-scene').replace(/ [|] .*$/, '');
  downloadFile(baseName + '.png', dataUrlToBlob(renderToPng()));
}

function dataUrlToBlob(dataUrl) {
  const [header, data] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bytes = atob(data);
  const buffer = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) buffer[i] = bytes.charCodeAt(i);
  return new Blob([buffer], { type: mime });
}

function downloadSceneJson() {
  const blob = new Blob([JSON.stringify(sceneSpec, null, 2)], { type: 'application/json' });
  const baseName = (document.title || 'optodraw-scene').replace(/ [|] .*$/, '');
  downloadFile(baseName + '.json', blob);
}

function downloadGlb() {
  if (window.odLight) window.odLight.control('tour', false);   // the tour's see-through copies never reach a file
  const exporter = new GLTFExporter();
  // hide the light so its glow does not end up in the file
  const light = window.odLight;
  const wasEnabled = light ? light.state.enabled : false;
  if (light && light.state.group) { light.state.enabled = false; light.state.group.visible = false; }
  const release = () => { if (light) light.state.enabled = wasEnabled; };
  exporter.parse(
    scene,
    (arrayBuffer) => {
      release();
      const blob = new Blob([arrayBuffer], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.download = (document.title || 'optodraw-scene').replace(/ [|] .*$/, '') + '.glb';
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
    },
    (error) => { release(); console.error('GLB export failed', error); },
    { binary: true }
  );
}

// --- Photoreal render: the studio renderer (CPU workers), the image render_3d_image saves ---
const odPT = { active: false, busy: false, gen: 0, url: null };
window.__odPT = odPT;                    // odLight hides the light while a render runs or shows
const _renderOverlay = document.getElementById('render-overlay');
const _renderStatus = document.getElementById('render-status');
function _ptShow(msg, withActions) {
  if (_renderStatus) _renderStatus.textContent = msg;
  if (_renderOverlay) _renderOverlay.hidden = false;
  const acts = _renderOverlay ? _renderOverlay.querySelector('.render-actions') : null;
  if (acts) acts.style.visibility = withActions ? 'visible' : 'hidden';
}
function _ptHide() { if (_renderOverlay) _renderOverlay.hidden = true; }
let _renderImage = null;
function _ptImage() {
  if (!_renderImage) {
    _renderImage = document.createElement('img');
    _renderImage.id = 'render-image';
    _renderImage.alt = 'Photoreal render';
    Object.assign(_renderImage.style, { position: 'fixed', left: '0', top: '0', width: '100%', height: '100%',
      objectFit: 'contain', zIndex: '15', pointerEvents: 'none', display: 'none' });
    document.body.appendChild(_renderImage);
  }
  return _renderImage;
}
async function odStartRender() {
  if (odPT.busy) return;
  if (window.odLight) window.odLight.control('tour', false);   // a photoreal render shows the parts as they are
  const gen = ++odPT.gen;
  odPT.busy = true; odPT.active = true; odPT.url = null;
  setLabels(false);                        // labels are never baked into a saved render
  _ptShow('Rendering… 0%', false);
  try {
    const url = await odStudio.render(THREE, scene, camera, odStudioOptions(renderer.domElement.width, renderer.domElement.height, {
      onProgress: (done, total) => {
        if (gen === odPT.gen && _renderStatus) _renderStatus.textContent = 'Rendering… ' + Math.floor((100 * done) / total) + '%';
      },
      cancelled: () => gen !== odPT.gen,
    }));
    if (gen !== odPT.gen) return;
    odPT.url = url;
    const img = _ptImage();
    img.src = url; img.style.display = '';
    _ptShow('Render complete · orbit to exit', true);
  } catch (e) {
    if (gen === odPT.gen) _ptShow('Render failed: ' + (e && e.message ? e.message : e), true);
  } finally {
    if (gen === odPT.gen) odPT.busy = false;
  }
}
function odExitRender() {
  odPT.gen++; odPT.busy = false; odPT.active = false; odPT.url = null;
  if (_renderImage) _renderImage.style.display = 'none';
  _ptHide();
}
function odSaveRender() {
  if (!odPT.url) return;
  const baseName = (document.title || 'optodraw-scene').replace(/ [|] .*$/, '');
  downloadFile(baseName + '-render.png', dataUrlToBlob(odPT.url));
}
controls.addEventListener('start', () => { if (odPT.active) odExitRender(); });   // the user moves the view
document.getElementById('btn-pathtrace')?.addEventListener('click', odStartRender);
document.getElementById('btn-render-save')?.addEventListener('click', odSaveRender);
document.getElementById('btn-render-exit')?.addEventListener('click', odExitRender);
document.getElementById('btn-labels')?.addEventListener('click', () => setLabels(!_labelsOn));
function odToggleFullscreen() {
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { (el.requestFullscreen || el.webkitRequestFullscreen || function() {}).call(el); }
  } catch (e) { console.warn('fullscreen failed', e); }
}
document.getElementById('btn-fullscreen')?.addEventListener('click', odToggleFullscreen);
// The bar: one menu open at a time, opening upward; a click outside or Escape closes it. The Light button turns
// the light on or off (odLight.setEnabled); Pause in its menu only freezes it.
(function() {
  const bar = document.getElementById('od-bar');
  if (!bar) return;
  const items = [...bar.querySelectorAll('.od-item')].filter((item) => item.querySelector('.od-menu'));
  function closeAll(except) {
    for (const item of items) {
      if (item === except) continue;
      item.querySelector('.od-menu').hidden = true;
      const trigger = item.querySelector('[aria-haspopup]');
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
    }
  }
  for (const item of items) {
    const trigger = item.querySelector('[aria-haspopup]'), menu = item.querySelector('.od-menu');
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.hidden;
      closeAll(item);
      menu.hidden = !open;
      trigger.setAttribute('aria-expanded', String(open));
    });
    menu.addEventListener('click', (e) => e.stopPropagation());
    for (const b of menu.querySelectorAll('button[data-camera-preset], button[data-export-hook], #btn-export-png-clear, #btn-pathtrace, #light-tour')) {
      b.addEventListener('click', () => closeAll(null));      // an action closes its menu; a toggle keeps it open
    }
  }
  document.addEventListener('click', () => closeAll(null));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(null); });
  const lightBtn = document.getElementById('anim-toggle');
  const sync = () => { if (lightBtn && window.odLight) lightBtn.setAttribute('aria-pressed', String(window.odLight.state.enabled)); };
  if (lightBtn) lightBtn.addEventListener('click', () => {
    if (!window.odLight) return;
    window.odLight.setEnabled(!window.odLight.state.enabled);
    sync();
  });
  sync();
  const labelsBtn = document.getElementById('btn-labels');
  if (labelsBtn) labelsBtn.addEventListener('click', () => labelsBtn.setAttribute('aria-pressed', String(_labelsOn)));
})();


// The studio renderer's options for this view: one place for a saved image and the Photoreal button.
function odStudioOptions(width, height, extra) {
  const w = WORLDS[_world] || WORLDS.light, none = _world === 'none';
  return Object.assign({
    width, height, samples: 4, quality: 'final', world: _world === 'dark' || _world === 'night' ? 'dark' : 'light',
    exposure: renderer.toneMappingExposure,
    background: none ? null : { top: w.bgTop, bottom: w.bgBottom },
    // a transparent image keeps its shadows on a catcher; a chip alone stands on a studio floor
    floor: none ? 'shadow' : (IS_ONCHIP && !MIXED ? 'studio' : null),
    floorColor: w.bgBottom,
  }, extra || {});
}
// --- Capture (a 3D image from Python): render once, write the PNG into the page, no loop ---
function odCapture() {
  window.__odView = { THREE, scene, camera, studio: typeof odStudio === 'undefined' ? null : odStudio };   // for checks
  const out = document.getElementById('od-capture');
  try {
    const W = OD_CAPTURE.width, H = OD_CAPTURE.height, S = OD_CAPTURE.scale || 1;
    camera.aspect = W / H; camera.updateProjectionMatrix();
    applyWorld(OD_CAPTURE.background === 'none' ? 'none' : OD_CAPTURE.background);
    odFrameToContent(0.9);
    renderer.setPixelRatio(1);
    renderer.setSize(Math.round(W * S), Math.round(H * S), false);
    if (composer) { composer.setPixelRatio(1); composer.setSize(Math.round(W * S), Math.round(H * S)); composer.render(); }
    else renderer.render(scene, camera);
    out.value = renderer.domElement.toDataURL('image/png');
  } catch (error) {
    out.value = 'error: ' + (error && error.message ? error.message : String(error));
  }
}
// --- Animate ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (window.odLight) window.odLight.tick();
  odRenderFrame();
}
if (OD_CAPTURE) odCapture(); else if (OD_VIDEO) odRenderFrame(); else animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
