[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "optodraw"
version = "0.10.1"
description = "Optical setups and photonic chips in 1D schematics, 2D SVG, 3D web scenes, TikZ, and GDS-aware workflows"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Prosper Dellah Allo" }
]
keywords = ["optics", "photonics", "electro-optics", "optomechanics", "diagram", "3D", "visualization", "teaching", "publication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    # shortcut: drawsvg 2.5.0 fails to import before Python 3.14 (a class header names a type it imports later);
    # lift the cap when a 2.5 release imports on 3.10 to 3.13
    "drawsvg>=2.0,<2.5",
    "shapely>=2.0",
    # the editor, and its 3D pages
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.0",
    # GDS files. trimesh needs mapbox-earcut to triangulate polygons and scipy for the mesh operations, and names
    # neither. gdsfactory 9 needs Python 3.12+, 3.11 gets 8.x, and 3.10 has no gdsfactory wheel
    "gdsfactory>=8.0,<9; python_version >= '3.11' and python_version < '3.12'",
    "gdsfactory>=9.0; python_version >= '3.12'",
    "gdstk>=0.9",
    "mapbox-earcut>=1.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "trimesh>=4.0",
    # PNG and GIF through resvg, a wheel with no system library; PDF through cairosvg where the cairo library loads,
    # else headless Chrome or Edge (optodraw.raster)
    "pillow>=10.0",
    "resvg_py>=0.5",
    "cairosvg>=2.7",
    # agents and notebooks
    "mcp[cli]>=1.0",
    "ipython>=8.0",
    "ipywidgets>=8.0",
]

[project.optional-dependencies]
# A plain install brings these already; the names stay so that older install lines still work.
three = []
gds = []
gif = []
figure = []
gui = []
mcp = []
notebook = []
# Not part of a plain install: each needs system libraries or brings a large stack.
manim = ["manim>=0.18"]                 # cairo, pango and ffmpeg
desktop = ["pywebview>=5.0"]            # the system's web view, for a native window
sax = ["sax>=0.18"]                     # JAX
all = ["optodraw[manim,desktop,sax]"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.13",
    "httpx2>=0.1",
    "build>=1.2",
    "twine>=5.0",
    "shapely>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ACCELUMA/optodraw"
Repository = "https://github.com/ACCELUMA/optodraw"
Issues = "https://github.com/ACCELUMA/optodraw/issues"

[project.scripts]
optodraw-mcp = "optodraw.mcp_server:main"
optodraw-render-blender = "optodraw.blender:main"
optodraw-xsection = "optodraw.gds.xsection.export:main"
optodraw-gui = "optodraw.app.launcher:main"
optodraw-skills = "optodraw.skills:main"

# optodraw is pure Python. The Rust crate in src/ builds a faster Vec3 and
# Transform3D, but no Python code imports them and a profile of a real render
# puts all of optodraw.core.transform at under 2% of the time — so building it
# bought nobody a thing and cost everybody a Rust toolchain to install from
# source. The crate stays for whoever profiles their way to needing it:
#   pip install maturin && maturin develop
[tool.hatch.build.targets.wheel]
packages = ["optodraw"]
# Data the package reads at runtime: the editor front end and the layer stacks.
artifacts = [
    "optodraw/app/static/**/*",
    "optodraw/gds/stacks/**/*",
    "optodraw/symbols/tikz/*.tex",
    "optodraw/symbols/svg/*.svg",
    "optodraw/symbols/symbols.json",
    "optodraw/symbols/variants.toml",
]

[tool.hatch.build.targets.sdist]
include = [
    "optodraw",
    "tests",
    "docs",
    "examples/quickplot_helpers.py",
    "src",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CITATION.cff",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"optodraw/**/__init__.py" = ["F401"]
"optodraw/__init__.py" = ["F401"]
"tests/**" = ["E741", "F841"]
# these import the module-scoped `editor` fixture from test_editor_layout_view; ruff reads each use as a redefinition
"tests/{test_editor_beam_style,test_editor_layout_cut,test_editor_technology_folder,test_layout_view_smoothness}.py" = ["F811"]
"docs/examples/**" = ["F821"]   # notebook cells use names from the cells before them

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "xsection_pdk: optional open-PDK cross-section integration (requires OPTODRAW_OPEN_PDK_STACK)",
    "slow: takes minutes; skipped unless OPTODRAW_SLOW=1",
]

[tool.coverage.run]
source = ["optodraw"]

[tool.coverage.report]
# The suite sits around 85%; the floor is a ratchet against silent erosion,
# not an aspiration. Move it up as coverage grows, never down.
fail_under = 80

# First ratchet: the names a user imports. follow_imports=silent reports only
# those files, so a new untyped component does not fail CI. Widen later.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
pretty = true
show_error_codes = true
files = [
    "optodraw/__init__.py",
    "optodraw/_compat.py",
]
