name: Bug report
description: Something renders wrong, crashes, or does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A screenshot and the scene JSON make almost every report solvable on the
        first pass. In the editor: **Export ▾ → Download JSON**.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The steps, or a short Python snippet that builds the scene.
      render: python
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or scene JSON
      description: Drag an image in, or paste the scene JSON.
  - type: input
    id: version
    attributes:
      label: optodraw version
      description: "`python -c \"import optodraw; print(optodraw.__version__)\"`"
      placeholder: 0.10.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python
      placeholder: macOS 15.4, Python 3.12
