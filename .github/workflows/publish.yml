name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pure-Python Hatchling build only. The Rust crate in src/ is an opt-in
      # local experiment (maturin develop), never a release artifact.
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
      - name: Check distributions
        run: |
          python -m twine check dist/*
          test -z "$(ls target/wheels 2>/dev/null)" || (echo "unexpected Rust wheels in release path" && exit 1)
      - name: Tag must match the package version
        if: github.event_name == 'release'
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          version = re.search(r'^version = "([^"]+)"', Path("pyproject.toml").read_text(), re.M).group(1)
          tag = "${{ github.event.release.tag_name }}".lstrip("v")
          assert tag == version, f"release tag {tag!r} != pyproject version {version!r}"
          print(f"release tag matches package version {version}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: optodraw-dist
          path: |
            dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: optodraw-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
