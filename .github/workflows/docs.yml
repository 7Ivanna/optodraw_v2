name: Docs

# Publishes the Astro site in docs/ to GitHub Pages. The build runs every example cell in CPython, so a
# cell that breaks fails the job. Enable Pages once with Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: astral-sh/setup-uv@v5          # the site serves its own wheel for the runnable cells
      - name: Install optodraw
        # the examples read GDS stacks (yaml), draw plots (matplotlib) and a 3D page (jinja2)
        run: pip install -e ".[gds,figure,three]"
      - name: Build site
        working-directory: docs
        env:
          OPTODRAW_PYTHON: python
        run: npm ci && npm run prepare:fonts && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
