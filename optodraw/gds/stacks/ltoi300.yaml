# Luxtelligence ltoi300: thin-film lithium tantalate on insulator, 300 nm LT. A PDK stack.
# Source: the open PDK github.com/Luxtelligence/lxt_pdk_gf, commit d16db6a (2026-06-01), files ltoi300/tech.py and
# ltoi300/layers.yaml. Each source: below names the file and its lines at that commit. Every number is the PDK's.
# sidewall_deg is the wall's angle from the wafer plane: 90 - the PDK's sidewall_angle, which gdsfactory measures
# from the vertical (as in gdsfactory_generic.yaml).
# The PDK draws the substrate, the BOX and the clad on WAFER (990/0); here they are the substrate, films and fill.
# The PDK LayerStack gives no z for its metals, heater and vias (M1, M2, HRL, VIA_M1_M2, VIA_M2_HRL), so they are
# named here and not drawn. The ridge has width_to_z=1 (tech.py:93), as optodraw draws every etch; the slab has none:
# a difference of up to 0.12 x tan(20 deg) = 0.044 um per edge.
#
