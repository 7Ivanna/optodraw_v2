# Luxtelligence lnoi400: thin-film lithium niobate on insulator, 400 nm LN. A PDK stack.
# Source: the open PDK github.com/Luxtelligence/lxt_pdk_gf, commit d16db6a (2026-06-01), files lnoi400/tech.py and
# lnoi400/layers.yaml. Each source: below names the file and its lines at that commit. Every number is the PDK's.
# sidewall_deg is the wall's angle from the wafer plane: 90 - the PDK's sidewall_angle, which gdsfactory measures
# from the vertical (as in gdsfactory_generic.yaml).
# The PDK draws the substrate, the BOX and the clad on WAFER (990/0); here they are the substrate, films and fill.
# The electrodes (1.4 to 2.3 um) stand 0.3 um over the flat clad (top 2.0 um), as in the PDK LayerStack.
# One known limit: the PDK gives the ridge width_to_z=1 (the drawn width is at the top, tech.py:94), and optodraw
# draws every etch that way. The slab has no width_to_z, so gdsfactory may put its drawn edge at the bottom: a
# difference of 0.2 x tan(13 deg) = 0.046 um per edge.
