# CornerStone Si (500 nm) — open-source SiPh PDK (cspdk.si500).
# z + thickness in microns, z = 0 = bottom of the Si device layer.

name: CornerStone Si 500 nm (open)
units: um

# The waveguide on-chip parts draw: the PDK's C-band rib (the O-band rib, xs_ro, is 0.40 um).
waveguide: {width: 0.45, provenance: pdk, source: "cspdk 1.0.1, si500/tech.py:123: Tech.width_rc, the width of xs_rc"}

# Process envelope: BOX below z=0, top cladding above; metals (heater/pad) sit ON
# the cladding and poke through — they never define the oxide surface.
# The pad (41/0) stands on the heater (39/0), as in the PDK: a pad drawn with no heater under it
# floats above the top oxide, and optodraw.gds.check_stack says so.
oxide:
  box:    {thickness: 3.0, material: sio2}   # buried oxide: z = -3.0 .. 0
  tox:    {thickness: 1.1, material: sio2}   # top cladding: z = 0 .. 1.1 (heater sits on it)
  handle: {thickness: 2.0, material: silicon}

layers:
  "3/0":  {name: Waveguide, zmin: 0.000, thickness: 0.500, material: silicon, color: "#c0392b"}
  "5/0":  {name: Slab,      zmin: 0.000, thickness: 0.200, material: silicon, color: "#e59866"}
  # implants (inside the silicon — thin, semi-transparent)
  "20/0": {name: N,   zmin: 0.160, thickness: 0.030, material: silicon, color: "#e74c3c", opacity: 0.5}
  "21/0": {name: P,   zmin: 0.160, thickness: 0.030, material: silicon, color: "#2980b9", opacity: 0.5}
  "24/0": {name: NPP, zmin: 0.150, thickness: 0.050, material: silicon, color: "#c0392b", opacity: 0.6}
  "25/0": {name: PPP, zmin: 0.150, thickness: 0.050, material: silicon, color: "#1f4e8c", opacity: 0.6}
  # heater + bond pad metal
  "39/0": {name: Heater, zmin: 1.100, thickness: 0.700, material: titanium_nitride, color: "#ebc634"}
  "41/0": {name: Pad,    zmin: 1.800, thickness: 0.700, material: aluminum,         color: "#008080"}
