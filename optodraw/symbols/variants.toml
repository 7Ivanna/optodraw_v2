# The prebuilt variants of the 1D symbols.
#
#   symbol     the pic, "od <symbol>" in tikz/
#   params     the pic's keys
#   component  the optodraw class this variant stands for (or "module:Class")
#   args       constructor arguments of that class for this variant
#   also       more classes that use this same variant with no arguments
#
# The build requires the symbol's port names and kinds to equal the
# component's. A row with no component is a 1D-only symbol.
# A class with no symbol_1d() method uses its first row that has no args.

# ---------------------------------------------------------------- waveguide
[[variant]]
symbol = "waveguide"
component = "Waveguide"

[[variant]]
symbol = "waveguide"
params = { length = 3.5 }

